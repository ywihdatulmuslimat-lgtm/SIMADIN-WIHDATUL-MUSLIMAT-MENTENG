function dashboard(){let now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),events=[...(db.kegiatan||[]).map(x=>({...x,_type:'kegiatan'})),...(db.kalender||[]).map(x=>({...x,_type:'kalender'}))].filter(x=>x.tanggal).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).slice(0,6);let cells=['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<div class=\"dayname\">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=(db.kalender||[]).filter(e=>e.tanggal===iso);cells+=`<div class=\"day ${d===now.getDate()?'today':''}\"><b>${d}</b>${ev.map(e=>`<span class=\"eventdot\">${esc(e.nama)}</span>`).join('')}</div>`}let activity=events.length?events.map(x=>`<button type=\"button\" class=\"quick\" style=\"width:100%;text-align:left;border:0;background:transparent;cursor:pointer\" ><span style=\"color:#087b49;font-size:19px\">●</span><div><b>${esc(x.nama)}</b><div class=\"muted small\">${esc(x.tanggal)}${x.lokasi?' · '+esc(x.lokasi):''}${x.waktu?' · '+esc(x.waktu):''}</div></div></button>`).join(''):'<div class=\"empty\">Belum ada aktivitas madrasah yang tercatat. Tambahkan kegiatan melalui menu Kegiatan.</div>';return `<div class=\"stats\">${stat('DATA SANTRI',db.santri.length,'♙','Santri terdaftar')}${stat('DATA GURU',db.guru.length,'♙','Tenaga pendidik')}${stat('KEGIATAN MADRASAH',db.kegiatan.length,'♧','Kegiatan tercatat')}${stat('PENILAIAN',db.nilai.length,'▤','Catatan penilaian siswa')}</div><div class=\"columns\"><div class=\"panel\"><div class=\"panelhead\"><h3>Aktivitas Madrasah</h3><button class=\"btn soft\" onclick=\"go('kegiatan')\">Lihat semua →</button></div>${activity}</div><div class=\"panel\"><div class=\"panelhead\"><h3>Mini Kalender</h3><b>${now.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b></div><div class=\"calendar\">${cells}</div><div class=\"actions\" style=\"margin-top:14px\"><button class=\"btn soft\" onclick=\"go('kalender')\">Buka Kalender Akademik →</button></div></div></div><div class=\"panel\" style=\"margin-top:20px\"><div class=\"panelhead\"><h3>Akses Cepat Administrasi</h3><span class=\"muted small\">Kelola kebutuhan madrasah</span></div><div class=\"actions\"><button class=\"btn soft\" onclick=\"go('santri')\">♙ Data Santri</button><button class=\"btn soft\" onclick=\"go('guru')\">♧ Data Guru</button><button class=\"btn soft\" onclick=\"go('nilai')\">✎ Penilaian & Rapor</button><button class=\"btn soft\" onclick=\"go('lembaga')\">⌂ Kelembagaan</button><button class=\"btn soft\" onclick=\"go('sarpras')\">▤ Sarana & Prasarana</button><button class=\"btn soft\" onclick=\"go('izin')\">▣ Legalitas & Izin</button><button class=\"btn soft\" onclick=\"go('backup')\">⇩ Ekspor Excel</button></div></div><div class=\"notice\">Data yang ditampilkan berasal dari isian aplikasi. Dashboard tidak menggunakan angka contoh. Lakukan pencadangan secara berkala dan batasi akses ke data pribadi santri.</div>`}
function tableFor(key,rows,actions=true){let fields=configs[key].fields.filter(f=>f[2]!=='file').slice(0,key==='santri'?7:5),photoField=configs[key].fields.find(f=>f[2]==='file');return `<div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${esc(f[1])}</th>`).join('')}${photoField?'<th>Foto / Lampiran</th>':''}${actions?'<th>Aksi</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(f=>`<td>${f[0]==='nama'?`<b>${esc(r[f[0]])}</b>`:esc(r[f[0]]||'-')}</td>`).join('')}${photoField?`<td>${r[photoField[0]]?`<div style="display:flex;align-items:center;gap:8px;min-width:150px"><a href="${esc(r[photoField[0]])}" target="_blank" rel="noopener"><img src="${esc(r[photoField[0]])}" alt="Foto ${esc(r.nama||photoField[1])}" style="width:64px;height:52px;object-fit:cover;border-radius:8px"></a><a class="btn btn-small" href="${esc(r[photoField[0]])}" download="${esc((r.nama||photoField[1]).replace(/[^a-z0-9_-]/gi,'_'))}.jpg">Unduh Foto</a></div>`:'Belum ada foto'}</td>`:''}${actions?`<td><button class="btn" onclick="editRow('${key}','${r.id}')">Edit</button> <button class="btn danger" onclick="delRow('${key}','${r.id}')">Hapus</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function modulePage(key){let c=configs[key],rows=db[key];return `<div class="panel"><div class="toolbar"><div><h3>${c.title}</h3><div class="muted small">Jumlah data: ${rows.length}</div></div><div class="actions"><input class="search" id="searchBox" placeholder="Cari data..."><button class="btn soft" onclick="exportCSV('${key}')">⇩ Excel / CSV</button><button class="btn primary" onclick="openForm('${key}')">＋ Tambah ${c.singular}</button></div></div><div id="tableArea">${rows.length?tableFor(key,rows):'<div class="empty">Belum ada data. Klik “Tambah” untuk mulai mengisi.</div>'}</div></div>${key==='santri'?'<div class="notice">Lengkapi identitas santri, NIK, nomor KK, kelas, data orang tua/wali, dan foto. Pastikan data pribadi hanya diakses oleh petugas berwenang.</div>':''}`}
function calendarPage(){let today=new Date(),year=today.getFullYear(),month=today.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),events=db.kalender||[];let cells='';['Min','Sen','Sel','Rab','Kam','Jum','Sab'].forEach(x=>cells+=`<div class="dayname">${x}</div>`);for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=events.filter(e=>e.tanggal===iso);cells+=`<div class="day ${d===today.getDate()?'today':''}"><b>${d}</b>${ev.map(e=>`<span class="eventdot" title="${esc(e.nama)}">${esc(e.nama)}</span>`).join('')}</div>`}return `<div class="panel"><div class="panelhead"><div><h3>${today.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</h3><div class="muted small">Agenda dan jadwal madrasah</div></div><button class="btn primary" onclick="openForm('kalender')">＋ Tambah Agenda</button></div><div class="calendar">${cells}</div></div>${modulePage('kalender')}`}
function backupPage(){return `<div class="panel"><h3>Ekspor data ke Excel</h3><p class="muted">Unduh data per bagian dalam format CSV yang dapat dibuka di Microsoft Excel atau Google Sheets.</p><div class="actions">${Object.keys(configs).map(k=>`<button class="btn soft" onclick="exportCSV('${k}')">⇩ ${configs[k].title}</button>`).join('')}</div></div><div class="panel"><h3>Cadangan seluruh data</h3><p class="muted">Simpan seluruh data aplikasi sebagai file JSON. File ini dapat digunakan untuk pemulihan data pada browser/perangkat lain.</p><div class="actions"><button class="btn primary" onclick="backupJSON()">⇩ Unduh Backup JSON</button><label class="btn" for="restoreFile">⇧ Pulihkan Backup</label><input id="restoreFile" type="file" accept=".json,application/json" class="hidden" onchange="restoreJSON(event)"></div></div><div class="notice">Penting: data tersimpan di browser ini saja (localStorage), belum tersinkron ke internet atau perangkat lain. Jangan gunakan sebagai satu-satunya arsip resmi. Backup secara rutin dan batasi akses perangkat.</div>`}
function render(){let html=current==='dashboard'?dashboard():current==='backup'?backupPage():current==='kalender'?calendarPage():configs[current]?modulePage(current):dashboard();$('#content').innerHTML=html;let s=$('#searchBox');if(s)s.addEventListener('input',()=>{let q=s.value.toLowerCase(),rows=db[current].filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));$('#tableArea').innerHTML=rows.length?tableFor(current,rows):'<div class="empty">Data tidak ditemukan.</div>'})}
function openForm(key,id=null){editId=id;let c=configs[key],row=id?db[key].find(x=>x.id===id)||{}:{};$('#modalTitle').textContent=(id?'Edit ':'Tambah ')+c.singular;$('#formFields').innerHTML=c.fields.map(f=>{let [name,label,type,full]=f,val=row[name]||'',cls=full?'field full':'field';if(type==='select')return `<div class="${cls}"><label>${label}</label><select name="${name}" ${full?'':' '}>${f[3].split('|').map(v=>`<option ${val===v?'selected':''}>${v}</option>`).join('')}</select></div>`;if(type==='textarea')return `<div class="${cls}"><label>${label}</label><textarea name="${name}">${esc(val)}</textarea></div>`;if(type==='file')return `<div class="${cls}"><label>${label}</label><input name="${name}" type="file" accept="image/*"><small class="muted">Foto disimpan sebagai data lokal. Ukuran disarankan di bawah 1 MB.</small>${val?`<div><img src="${val}" style="width:90px;height:70px;object-fit:cover;border-radius:9px;margin-top:6px"><a class="btn btn-small" href="${val}" download="${(row.nama||label).replace(/[^a-z0-9_-]/gi,'_')}.jpg">Unduh Foto</a></div>`:''}</div>`;return `<div class="${cls}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${name==='nik'||name==='kk'?'inputmode="numeric"':''}></div>`}).join('');$('#dataForm').dataset.key=key;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}function editRow(k,id){openForm(k,id)}function delRow(k,id){if(confirm('Hapus data ini?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}
onDOMReady(()=>$('#dataForm').addEventListener('submit',async e=>{e.preventDefault();let key=e.currentTarget.dataset.key,form=new FormData(e.currentTarget),obj={};for(let [k,v] of form.entries()){if(v instanceof File){if(v.size){if(v.size>1500000){alert('Ukuran foto maksimal 1,5 MB.');return}obj[k]=await fileData(v)}}else obj[k]=v}let old=editId?db[key].find(x=>x.id===editId):null;if(old){Object.assign(old,obj)}else db[key].push({id:crypto.randomUUID(),...obj,created:new Date().toISOString()});save();closeModal();render()}));function fileData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function exportCSV(key){let rows=db[key],fields=configs[key].fields.filter(f=>f[2]!=='file').map(f=>f[0]),labels=configs[key].fields.filter(f=>f[2]!=='file').map(f=>f[1]);let csv=[labels,...rows.map(r=>fields.map(f=>r[f]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});download(blob,`${key}_madrasah.csv`)}function backupJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'backup_madrasah_wihdatul_muslimat.json')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}function restoreJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!confirm('Pulihkan data? Data saat ini akan diganti.'))return;Object.keys(configs).forEach(k=>d[k]??=[]);db=d;save();go('dashboard');alert('Data berhasil dipulihkan.')}catch{alert('File backup tidak valid.')}};r.readAsText(f)}
onDOMReady(render);
</script>
<script>

      if (!configs[key].fields.some(existing => existing[0] === field[0])) {
        configs[key].fields.push(field);
      }
    });
  };

  addFields('santri', [
    ['tahun_ajaran', 'Tahun ajaran', 'text'],
    ['status', 'Status santri', 'select', 'Aktif|Tidak aktif|Lulus'],
    ['ibu', 'Nama ibu', 'text'],
    ['ayah', 'Nama ayah', 'text'],
    ['foto', 'Foto santri', 'file']
  ]);
  addFields('guru', [
    ['kode', 'Kode guru', 'text'],
    ['gender', 'Jenis kelamin', 'select', 'Laki-laki|Perempuan'],

    ['tanggal_lahir', 'Tanggal lahir', 'date'],

    ['mulai_mengajar', 'Tanggal mulai mengajar', 'date'],
    ['foto', 'Foto guru', 'file']
  ]);
  const classField = configs.santri.fields.find(field => field[0] === 'kelas');
  classField[2] = 'select';
  classField[3] = 'Kelas 1|Kelas 2|Kelas 3|Kelas 4|Kelas 5|Kelas 6';

  const extraConfigs = {
    wali: {
      title: 'Data Wali Santri', singular: 'Wali Santri',
      fields: [['nama', 'Nama lengkap', 'text', 1], ['nik', 'NIK', 'text'], ['telepon', 'Nomor HP', 'tel'], ['email', 'Email', 'email'], ['alamat', 'Alamat', 'textarea', 1], ['pekerjaan', 'Pekerjaan', 'text']]
    },
    kelas: {
      title: 'Data Kelas', singular: 'Kelas',
      fields: [['nama', 'Nama kelas', 'text'], ['tingkat', 'Tingkat', 'select', 'Kelas 1|Kelas 2|Kelas 3|Kelas 4|Kelas 5|Kelas 6'], ['wali_kelas', 'Wali kelas', 'text'], ['tahun_ajaran', 'Tahun ajaran', 'text'], ['keterangan', 'Keterangan', 'textarea', 1]]
    },
    anak_asuh: {
      title: 'Data Anak Asuh', singular: 'Anak Asuh',
      fields: [['nama', 'Nama lengkap', 'text', 1], ['tanggal_lahir', 'Tanggal lahir', 'date'], ['gender', 'Jenis kelamin', 'select', 'Laki-laki|Perempuan'], ['kelas', 'Kelas', 'text'], ['nama_wali', 'Nama wali', 'text'], ['telepon_wali', 'Nomor HP wali', 'tel'], ['status', 'Status', 'select', 'Aktif|Tidak aktif'], ['keterangan', 'Keterangan', 'textarea', 1]]
    },
    lansia: {
      title: 'Data Lansia', singular: 'Lansia',
      fields: [['nama', 'Nama lengkap', 'text', 1], ['nik', 'NIK', 'text'], ['tanggal_lahir', 'Tanggal lahir', 'date'], ['alamat', 'Alamat', 'textarea', 1], ['telepon', 'Nomor HP', 'tel'], ['status', 'Status', 'select', 'Aktif|Tidak aktif']]
    },
    pengguna: {
      title: 'Data Pengguna', singular: 'Pengguna',
      fields: [['nama', 'Nama lengkap', 'text', 1], ['username', 'Username', 'text'], ['role', 'Peran', 'select', 'Super Admin|Operator|Kepala Madrasah|Guru'], ['status', 'Status', 'select', 'Aktif|Tidak aktif']]
    },
    riwayat_kelas: {
      title: 'Riwayat Kelas Santri', singular: 'Riwayat Kelas',
      fields: [['nis', 'NIS santri', 'text'], ['nama_santri', 'Nama santri', 'text'], ['kelas', 'Kelas', 'text'], ['tahun_ajaran', 'Tahun ajaran', 'text'], ['catatan', 'Catatan perubahan', 'textarea', 1]]
    },
    riwayat_mengajar: {
      title: 'Riwayat Mengajar', singular: 'Riwayat Mengajar',
      fields: [['kode_guru', 'Kode guru', 'text'], ['nama_guru', 'Nama guru', 'text'], ['mapel', 'Mata pelajaran', 'text'], ['kelas', 'Kelas', 'text'], ['tahun_ajaran', 'Tahun ajaran', 'text'], ['status', 'Status', 'select', 'Aktif|Selesai']]
    }
  };

  Object.keys(extraConfigs).forEach(key => { configs[key] = extraConfigs[key]; });
  // SIMADIN final navigation: wali and kelas are fields inside Data Santri, not standalone modules.
  delete configs.wali;
  delete configs.kelas;
  delete configs.riwayat_kelas;
  delete configs.riwayat_mengajar;
  ['guru_sk', 'guru_dokumen'].forEach(key => {
    if (!Array.isArray(db[key])) db[key] = [];
  });
  Object.keys(configs).forEach(key => {
    if (!Array.isArray(db[key])) db[key] = [];
  });

  const nav = document.querySelector('.nav');
  const menuItems = [
    ['santri', '♙', 'Data Santri'],
    ['guru', '♧', 'Data Guru'],
    // Data kelas and wali are managed within Data Santri; no separate menu.
  ];
  if (nav) {
    menuItems.forEach(([page, icon, label]) => {
      if (nav.querySelector(`[data-page="${page}"]`)) return;
      const button = document.createElement('button');
      button.dataset.page = page;
      button.innerHTML = `<span class="ico">${icon}</span>${label}`;
      button.addEventListener('click', () => go(page));
      nav.appendChild(button);
    });
  }

  const style = document.createElement('style');
  style.textContent = `
    .data-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
    .data-filters select,.data-filters input{border:1px solid #dfe8e1;border-radius:9px;padding:9px 10px;background:white;color:#203329}
    .person-cell{display:flex;align-items:center;gap:11px;min-width:190px}
    .person-photo{width:50px;height:50px;flex:0 0 50px;object-fit:cover;border-radius:50%;background:#eaf6ed;cursor:pointer}
    .person-initial{display:grid;place-items:center;color:#146b3a;font-weight:800;font-size:17px}
    .row-actions{display:flex;gap:5px}
    .profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .profile-item{padding:10px 12px;border:1px solid #e3ebe5;border-radius:10px;background:#fbfdfb}
    .profile-item small{display:block;color:#718078;margin-bottom:3px}
    .profile-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
    .profile-tabs button.active{background:#146b3a;color:white;border-color:#146b3a}
    .profile-photo-large{width:110px;height:110px;object-fit:cover;border-radius:50%;background:#eaf6ed}
    .print-only{display:none}
    @media print{.sidebar,.top,.toolbar,.data-filters,.row-actions,.footer,.notice{display:none!important}.main{margin:0!important;width:100%!important;padding:0!important}.panel{box-shadow:none!important;border:0!important}.print-only{display:block}}
    @media(max-width:650px){.data-filters>*{flex:1 1 100%;max-width:none}.profile-grid{grid-template-columns:1fr}.person-photo{width:44px;height:44px;flex-basis:44px}}
  `;
  document.head.appendChild(style);

  const fallbackAvatar = name => {
    const initials = String(name || '?').trim().split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase();
    return `<span class="person-photo person-initial" aria-label="Avatar">${esc(initials || '?')}</span>`;
  };
  const jsArg = value => esc(JSON.stringify(String(value)).replace(/[<>&]/g, character =>
    `\\u${character.charCodeAt(0).toString(16).padStart(4, '0')}`
  ));
  const photo = (record, kind) => record.foto
    ? `<img class="person-photo" src="${esc(record.foto)}" alt="Foto ${kind}" onclick="previewPhoto(${jsArg(record.id)},${jsArg(kind)})">`
    : fallbackAvatar(record.nama);
  const ageOf = value => {
    if (!value) return '-';
    const birth = new Date(value);
    if (Number.isNaN(birth.getTime())) return '-';
    const now = new Date();
    let age = now.getFullYear() - birth.getFullYear();
    if (now < new Date(now.getFullYear(), birth.getMonth(), birth.getDate())) age--;
    return age >= 0 ? `${age} tahun` : '-';
  };
  const rowsFor = key => db[key] || [];

  function filteredRows(key) {
    const query = (document.querySelector('#dataSearch')?.value || '').trim().toLowerCase();
    const classValue = document.querySelector('#classFilter')?.value || '';
    const yearValue = document.querySelector('#yearFilter')?.value || '';
    const statusValue = document.querySelector('#statusFilter')?.value || '';
    const subjectValue = document.querySelector('#subjectFilter')?.value || '';
    return rowsFor(key).filter(row => {
      const matchesQuery = !query || Object.values(row).some(value => typeof value !== 'object' && String(value || '').toLowerCase().includes(query));
      const matchesClass = !classValue || String(row.kelas || '').toLowerCase().replace(/^kelas\s*/, '') === classValue.replace(/^kelas\s*/i, '').toLowerCase();
      const matchesYear = !yearValue || row.tahun_ajaran === yearValue;
      const matchesStatus = !statusValue || row.status === statusValue;
      const matchesSubject = !subjectValue || row.mapel === subjectValue;
      return matchesQuery && matchesClass && matchesYear && matchesStatus && matchesSubject;
    });
  }

  function recordTable(key, rows) {
    const body = key === 'santri'
      ? rows.map((row, index) => `<tr>

          <td>${esc(row.nama_wali || row.ayah || row.ibu || '-')}</td><td><span class="tag">${esc(row.status || 'Belum diisi')}</span></td>
          <td><div class="row-actions"><button class="btn soft" onclick="openProfile('santri',${jsArg(row.id)})">Detail</button><button class="btn" onclick="editRow('santri',${jsArg(row.id)})">Edit</button><button class="btn danger" onclick="delRow('santri',${jsArg(row.id)})">Hapus</button></div></td>
        </tr>`).join('')
      : rows.map((row, index) => `<tr>
          <td>${index + 1}</td>
          <td><div class="person-cell">${photo(row, 'guru')}<div><b>${esc(row.nama || '-')}</b><div class="muted small">${esc(row.kode || row.nuptk || 'Kode belum diisi')}</div></div></div></td>
          <td>${esc(row.nik || '-')}</td><td>${esc(row.gender || '-')}</td><td>${esc(row.pendidikan || '-')}</td>
          <td>${esc(row.mapel || '-')}</td><td>${esc(row.jabatan || '-')}</td><td>${esc(row.telepon || '-')}</td>

          <td><div class="row-actions"><button class="btn soft" onclick="openProfile('guru',${jsArg(row.id)})">Detail</button><button class="btn" onclick="editRow('guru',${jsArg(row.id)})">Edit</button><button class="btn danger" onclick="delRow('guru',${jsArg(row.id)})">Hapus</button></div></td>
        </tr>`).join('');
    const headers = key === 'santri'
      ? '<th>No.</th><th>Foto & Nama Santri</th><th>NIK</th><th>Kelas</th><th>Tahun Ajaran</th><th>Orang Tua / Wali</th><th>Status</th><th>Aksi</th>'
      : '<th>No.</th><th>Foto & Nama Guru</th><th>NIK</th><th>Jenis Kelamin</th><th>Pendidikan</th><th>Mata Pelajaran</th><th>Jabatan</th><th>Nomor HP</th><th>Status</th><th>Jumlah SK</th><th>Aksi</th>';
    return rows.length
      ? `<div class="tablewrap"><table><thead><tr>${headers}</tr></thead><tbody>${body}</tbody></table></div>`
      : '<div class="empty">Data tidak ditemukan. Periksa pencarian atau filter.</div>';
  }

  function dataPage(key) {
    const isStudent = key === 'santri';
    const title = configs[key].title;
    const records = rowsFor(key);
    const years = [...new Set(records.map(row => row.tahun_ajaran).filter(Boolean))].sort();
    const subjects = [...new Set(records.map(row => row.mapel).filter(Boolean))].sort();
    const filters = isStudent
      ? `<select id="classFilter" aria-label="Filter kelas"><option value="">Semua Kelas</option>${[1,2,3,4,5,6].map(n => `<option value="${n}">Kelas ${n}</option>`).join('')}</select>
         <select id="yearFilter" aria-label="Filter tahun ajaran"><option value="">Semua Tahun Ajaran</option>${years.map(year => `<option>${esc(year)}</option>`).join('')}</select>
         <select id="statusFilter" aria-label="Filter status"><option value="">Semua Status</option><option>Aktif</option><option>Tidak aktif</option><option>Lulus</option></select>`
      : `<select id="subjectFilter" aria-label="Filter mata pelajaran"><option value="">Semua Mata Pelajaran</option>${subjects.map(subject => `<option>${esc(subject)}</option>`).join('')}</select>
         <select id="statusFilter" aria-label="Filter status"><option value="">Semua Status</option><option>Aktif</option><option>Tidak aktif</option></select>`;
    return `<div class="panel">
      <div class="toolbar"><div><h3>${title}</h3><div class="muted small">Jumlah total data: ${records.length}</div></div>
        <div class="actions"><button class="btn" onclick="window.print()">Cetak / PDF</button><button class="btn soft" onclick="exportCSV('${key}')">Ekspor Excel / CSV</button><button class="btn primary" onclick="openForm('${key}')">＋ Tambah ${configs[key].singular}</button></div>
      </div>
      <div class="data-filters"><input id="dataSearch" placeholder="${isStudent ? 'Cari nama, NIS, NIK, wali, atau kelas...' : 'Cari nama, kode guru, atau NIK...'}">${filters}</div>
      <div id="enhancedTable">${recordTable(key, filteredRows(key))}</div>
    </div>
    <div class="notice">Prototipe HTML ini menyimpan data pada browser/perangkat ini saja. Jangan masukkan data pribadi nyata atau dokumen resmi sebelum tersedia backend dengan autentikasi dan penyimpanan aman.</div>`;
  }

  function profileItem(label, value) {
    return `<div class="profile-item"><small>${esc(label)}</small><b>${esc(value || '-')}</b></div>`;
  }

  function studentProfile(row) {
    const history = rowsFor('riwayat_kelas').filter(item => item.nis && item.nis === row.nis);
    const scores = rowsFor('nilai').filter(item => item.santri && item.santri.toLowerCase() === String(row.nama || '').toLowerCase());
    const attendance = (db.absensi || []).filter(item => item.santri && item.santri.toLowerCase() === String(row.nama || '').toLowerCase());
    return `<div class="profile-grid">
      ${profileItem('NIS', row.nis)}${profileItem('NIK', row.nik)}${profileItem('Tempat, tanggal lahir', [row.lahir, row.tanggal_lahir].filter(Boolean).join(', '))}
      ${profileItem('Umur', ageOf(row.tanggal_lahir))}${profileItem('Jenis kelamin', row.gender)}${profileItem('Kelas', row.kelas)}
      ${profileItem('Tahun ajaran', row.tahun_ajaran)}${profileItem('Status', row.status)}${profileItem('Nama ayah', row.ayah)}
      ${profileItem('Nama ibu', row.ibu)}${profileItem('Orang tua / wali', row.nama_wali)}${profileItem('Telepon wali', row.telepon_wali)}
      ${profileItem('Alamat', row.alamat)}
    </div>
    <div class="panel" style="margin-top:14px"><h3>Riwayat Kelas</h3>${history.length ? `<div class="tablewrap"><table><thead><tr><th>Kelas</th><th>Tahun Ajaran</th><th>Catatan</th></tr></thead><tbody>${history.map(item => `<tr><td>${esc(item.kelas)}</td><td>${esc(item.tahun_ajaran)}</td><td>${esc(item.catatan || '-')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small">Belum ada riwayat kelas yang dicatat.</p>'}</div>
    <div class="profile-grid">${profileItem('Catatan nilai', scores.length)}${profileItem('Catatan absensi', attendance.length)}</div>`;
  }

  function guruTabContent(row, tab) {
    if (tab === 'mengajar') {
      const assignments = rowsFor('riwayat_mengajar').filter(item => item.kode_guru === (row.kode || row.nuptk) || item.nama_guru === row.nama);
      return assignments.length
        ? `<div class="tablewrap"><table><thead><tr><th>Mata Pelajaran</th><th>Kelas</th><th>Tahun Ajaran</th><th>Status</th></tr></thead><tbody>${assignments.map(item => `<tr><td>${esc(item.mapel)}</td><td>${esc(item.kelas)}</td><td>${esc(item.tahun_ajaran)}</td><td>${esc(item.status)}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty">Belum ada riwayat mengajar. Catat melalui menu Riwayat Mengajar.</div>';
    }
    if (tab === 'sk') {
      const archive = rowsFor('guru_sk').filter(item => item.guru_id === row.id);
      return `<div id="skForm" class="panel"><h3>Tambah Arsip SK</h3>
        <div class="notice">Mode HTML lokal: unggahan tersimpan di browser ini dan tidak dilindungi hak akses server. Gunakan berkas DEMO saja; jangan unggah SK atau data pribadi asli.</div>
        <div class="formgrid"><div class="field"><label>Nomor SK</label><input name="nomor" required></div>
          <div class="field"><label>Jenis SK</label><select name="jenis">${['SK Pengangkatan Guru','SK Pengangkatan Kepala Madrasah','SK Pembagian Tugas Mengajar','SK Wali Kelas','SK Perpanjangan Masa Tugas','SK Pemberhentian','SK Lainnya'].map(value => `<option>${value}</option>`).join('')}</select></div>
          <div class="field"><label>Tanggal penetapan</label><input name="tanggal" type="date"></div><div class="field"><label>Mulai berlaku</label><input name="mulai" type="date"></div>
          <div class="field"><label>Tanggal berakhir</label><input name="akhir" type="date"></div><div class="field"><label>Jabatan dalam SK</label><input name="jabatan"></div>
          <div class="field"><label>Pejabat penetap</label><input name="pejabat"></div>
          <div class="field"><label>File PDF / JPG / PNG (maks. 500 KB)</label><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"></div>
          <div class="field full"><label>Keterangan</label><textarea name="keterangan"></textarea></div></div>
        <button class="btn primary" type="button" onclick="saveSk(${jsArg(row.id)})">＋ Simpan SK</button></div>
        <div class="panel"><h3>Arsip SK (${archive.length})</h3>${archive.length ? `<div class="tablewrap"><table><thead><tr><th>Nomor</th><th>Jenis</th><th>Tanggal</th><th>Masa Berlaku</th><th>Dokumen</th><th>Aksi</th></tr></thead><tbody>${archive.map(item => `<tr><td>${esc(item.nomor)}</td><td>${esc(item.jenis)}</td><td>${esc(item.tanggal || '-')}</td><td>${esc(item.mulai || '-')} – ${esc(item.akhir || 'Tidak ditentukan')}</td><td>${esc(item.fileName || 'Tidak ada file')}</td><td>${item.fileData ? `<a class="btn soft" href="${esc(item.fileData)}" target="_blank" rel="noopener">Lihat</a> <a class="btn" href="${esc(item.fileData)}" download="${esc(item.fileName)}">Unduh</a>` : '—'} <button class="btn danger" onclick="deleteSk(${jsArg(item.id)},${jsArg(row.id)})">Hapus</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Belum ada arsip SK.</div>'}</div>`;
    }
    if (tab === 'dokumen') {
      return '<div class="notice">Daftar dokumen pendukung dapat dicatat melalui menu Data Dokumen. Penyimpanan file aman membutuhkan backend server.</div>';
    }
    return `<div class="profile-grid">
      ${profileItem('Kode guru', row.kode || row.nuptk)}${profileItem('NIK', row.nik)}${profileItem('Jenis kelamin', row.gender)}
      ${profileItem('Tempat, tanggal lahir', [row.lahir, row.tanggal_lahir].filter(Boolean).join(', '))}${profileItem('Umur', ageOf(row.tanggal_lahir))}
      ${profileItem('Pendidikan terakhir', row.pendidikan)}${profileItem('Mata pelajaran', row.mapel)}${profileItem('Jabatan', row.jabatan)}
      ${profileItem('Nomor HP/WhatsApp', row.telepon)}${profileItem('Email', row.email)}${profileItem('Tanggal mulai mengajar', row.mulai_mengajar)}
      ${profileItem('Status', row.status)}${profileItem('Alamat', row.alamat)}
    </div>`;
  }

  window.openProfile = (kind, id, selectedTab) => {
    const row = rowsFor(kind).find(item => item.id === id);
    if (!row) return;
    const dialog = document.querySelector('#modal .dialog');
    const modalTitle = document.querySelector('#modalTitle');
    modalTitle.textContent = `Profil ${kind === 'guru' ? 'Guru' : 'Santri'} · ${row.nama || ''}`;
    const tabs = kind === 'guru' ? [
      ['identitas', 'Identitas Guru'], ['mengajar', 'Riwayat Mengajar'], ['sk', 'Arsip SK'], ['dokumen', 'Dokumen Pendukung']
    ] : [];
    const activeTab = selectedTab || 'identitas';
    const image = row.foto ? `<img class="profile-photo-large" src="${esc(row.foto)}" alt="Foto profil">` : fallbackAvatar(row.nama);
    document.querySelector('#formFields').innerHTML = `<div id="profileContent" class="field full">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">${image}<div><h3>${esc(row.nama || '-')}</h3><div class="muted">${esc(kind === 'guru' ? row.kode || row.nuptk || 'Kode belum diisi' : row.nis || 'NIS belum diisi')}</div></div></div>
      ${kind === 'guru' ? `<div class="profile-tabs">${tabs.map(([value, label]) => `<button type="button" class="btn ${value === activeTab ? 'active' : ''}" onclick="openProfile('guru',${jsArg(row.id)},'${value}')">${label}</button>`).join('')}</div><div id="guruTab">${guruTabContent(row, activeTab)}</div>` : studentProfile(row)}
      <div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="editFromProfile('${kind}',${jsArg(row.id)})">Edit Profil</button></div>
    </div>`;
    document.querySelector('#dataForm > .actions').style.display = 'none';
    document.querySelector('#modal').classList.add('show');
  };

  window.editFromProfile = (kind, id) => {
    document.querySelector('#dataForm > .actions').style.display = '';
    openForm(kind, id);
  };

  window.deleteSk = (skId, teacherId) => {
    if (!confirm('Hapus arsip SK ini dari penyimpanan browser?')) return;
    db.guru_sk = rowsFor('guru_sk').filter(item => item.id !== skId);
    save();
    openProfile('guru', teacherId, 'sk');
  };
  window.previewPhoto = (id, kind) => {
    const item = rowsFor(kind === 'guru' ? 'guru' : 'santri').find(record => record.id === id);
    if (!item || !item.foto) return;
    const preview = window.open('', '_blank');
    if (!preview) return;
    preview.opener = null;
    preview.document.write(`<title>Foto ${esc(item.nama)}</title><img src="${esc(item.foto)}" alt="Foto ${esc(item.nama)}" style="max-width:95vw;max-height:95vh;display:block;margin:auto">`);
    preview.document.close();
  };

  window.saveSk = teacherId => {
    const teacher = rowsFor('guru').find(row => row.id === teacherId);
    const form = document.querySelector('#skForm');
    if (!teacher || !form) return;
    const value = name => form.querySelector(`[name="${name}"]`).value;
    const file = form.querySelector('[name="file"]').files[0] || new File([], '');
    const allowed = ['application/pdf', 'image/jpeg', 'image/png'];
    const extensionOk = /\.(pdf|jpe?g|png)$/i.test(file.name || '');
    if (file.size > 512000) {
      alert('Ukuran dokumen maksimal 500 KB pada prototipe HTML ini.');
      return;
    }
    if (file.size && (!allowed.includes(file.type) || !extensionOk)) {
      alert('Pilih dokumen PDF, JPG, JPEG, atau PNG yang valid.');
      return;
    }
    const saveRecord = fileData => {
      db.guru_sk.push({
        id: crypto.randomUUID(), guru_id: teacher.id,
        nomor: value('nomor'), jenis: value('jenis'),
        tanggal: value('tanggal'), mulai: value('mulai'),
        akhir: value('akhir'), jabatan: value('jabatan'),
        pejabat: value('pejabat'), keterangan: value('keterangan'),
        fileName: file.size ? file.name : '', fileData,
        dibuat: new Date().toISOString()
      });
      save();
      openProfile('guru', teacher.id, 'sk');
    };
    if (!value('nomor').trim()) {
      alert('Nomor SK wajib diisi.');
      return;
    }
    if (file.size) {
      const reader = new FileReader();
      reader.onload = () => saveRecord(reader.result);
      reader.onerror = () => alert('File tidak dapat dibaca. Coba pilih file lain.');
      reader.readAsDataURL(file);
    } else {
      saveRecord('');
    }
  }

  const originalRender = window.render;
  const originalOpenForm = window.openForm;
  window.openForm = function (key, id = null) {
    originalOpenForm(key, id);
    if (key !== 'guru' || id) return;
    const codeField = document.querySelector('#formFields input[name="kode"]');
    if (!codeField) return;
    const used = new Set(rowsFor('guru').map(row => row.kode).filter(Boolean));
    let sequence = 1;
    let code = '';
    do {
      code = `GR-${new Date().getFullYear()}-${String(sequence++).padStart(4, '0')}`;
    } while (used.has(code));
    codeField.value = code;
    codeField.readOnly = true;
  };
  const originalDelete = window.delRow;
  window.delRow = function (key, id) {
    if (key !== 'guru') {
      originalDelete(key, id);
      return;
    }
    if (!confirm('Hapus guru beserta arsip SK dan dokumen terkait dari browser ini?')) return;
    db.guru_sk = rowsFor('guru_sk').filter(item => item.guru_id !== id);
    db.guru_dokumen = rowsFor('guru_dokumen').filter(item => item.guru_id !== id);
    db.guru = rowsFor('guru').filter(item => item.id !== id);
    save();
    render();
  };
  window.render = function () {
    if (current !== 'santri' && current !== 'guru') {
      originalRender();
      return;
    }
    document.querySelector('#content').innerHTML = dataPage(current);
    const updateTable = () => {
      document.querySelector('#enhancedTable').innerHTML = recordTable(current, filteredRows(current));
      const count = document.querySelector('#content .toolbar .muted');
      if (count) count.textContent = `Jumlah total data: ${rowsFor(current).length} · Ditampilkan: ${filteredRows(current).length}`;
    };
    document.querySelectorAll('.data-filters input,.data-filters select').forEach(control => {
      control.addEventListener('input', updateTable);
      control.addEventListener('change', updateTable);
    });
  };

  window.go = ((previousGo) => function (page) {
    previousGo(page);
    const title = document.querySelector('#pageTitle');
    if (title && configs[page]) title.textContent = configs[page].title;
  })(window.go);

  document.querySelector('#modal .close').addEventListener('click', () => {
    document.querySelector('#dataForm').classList.remove('hidden');
    document.querySelector('#dataForm > .actions').style.display = '';
  });
  document.querySelector('#modal').addEventListener('click', event => {
    if (event.target.id === 'modal') {
      document.querySelector('#dataForm').classList.remove('hidden');
      document.querySelector('#dataForm > .actions').style.display = '';
    }
  });
  onDOMReady(() => {
    document.querySelector('#dataForm').classList.remove('hidden');
    document.querySelector('#dataForm > .actions').style.display = '';
    document.querySelectorAll('[data-page]').forEach(button => {
      button.classList.toggle('active', button.dataset.page === current);
    });
    window.render();
  });
})();
</script><script src="assets/revisi-simadin.js?v=final-aktivitas-foto-kelas-20261127"></script></body></html>
